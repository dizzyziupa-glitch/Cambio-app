
<script>
  const pantallas = {
    inicio: document.getElementById("inicio"),
    directorio: document.getElementById("directorio"),
    ficha: document.getElementById("ficha")
  };

  const tasas = {
    BOB: { nombre: "bolivianos", simbolo: "Bs", porDolar: 11.85, decimales: 2 },
    PEN: { nombre: "soles peruanos", simbolo: "S/", porDolar: 3.42, decimales: 2 },
    PYG: { nombre: "guaraníes paraguayos", simbolo: "₲", porDolar: 7200, decimales: 0 }
  };

  let monedaSeleccionada = "BOB";

  function mostrarPantalla(nombre) {
    Object.entries(pantallas).forEach(([clave, elemento]) => {
      elemento.classList.toggle("oculto", clave !== nombre);
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Navegación entre las pantallas.
  document.getElementById("abrirDirectorio").addEventListener("click", () => {
    mostrarPantalla("directorio");
  });

  document.getElementById("irNegocios").addEventListener("click", () => {
    mostrarPantalla("directorio");
  });

  document.getElementById("volverInicio").addEventListener("click", () => {
    mostrarPantalla("inicio");
  });

  document.getElementById("volverDirectorio").addEventListener("click", () => {
    mostrarPantalla("directorio");
  });

  // Selección de moneda mediante las banderas.
  document.querySelectorAll("[data-moneda]").forEach(boton => {
    boton.setAttribute("aria-pressed", boton.dataset.moneda === monedaSeleccionada);

    boton.addEventListener("click", () => {
      monedaSeleccionada = boton.dataset.moneda;

      document.querySelectorAll("[data-moneda]").forEach(item => {
        const seleccionada = item.dataset.moneda === monedaSeleccionada;
        item.classList.toggle("activa", seleccionada);
        item.setAttribute("aria-pressed", String(seleccionada));
      });

      document.getElementById("avisoCalculo").classList.add("oculto");
    });
  });

  // Cálculo ilustrativo con las cotizaciones de ejemplo de la pantalla.
  function calcularConversion() {
    const campo = document.getElementById("importe");
    const importe = Number(campo.value);
    const aviso = document.getElementById("avisoCalculo");

    if (campo.value.trim() === "" || !Number.isFinite(importe) || importe <= 0) {
      aviso.innerHTML = `
        <div>ℹ️</div>
        <div>
          <h3>Revisá el importe</h3>
          <p>Ingresá una cantidad de pesos argentinos mayor que cero.</p>
        </div>
      `;
      aviso.classList.remove("oculto");
      campo.focus();
      return;
    }

    // Conversión cruzada ilustrativa:
    // pesos argentinos → dólares de referencia → moneda de destino.
    const dolarBlueARS = 1540;
    const destino = tasas[monedaSeleccionada];
    const resultado = (importe / dolarBlueARS) * destino.porDolar;

    const formato = new Intl.NumberFormat("es-AR", {
      minimumFractionDigits: destino.decimales,
      maximumFractionDigits: destino.decimales
    }).format(resultado);

    const pesosFormato = new Intl.NumberFormat("es-AR", {
      maximumFractionDigits: 2
    }).format(importe);

    const bandera = {
      BOB: "🇧🇴",
      PEN: "🇵🇪",
      PYG: "🇵🇾"
    }[monedaSeleccionada];

    aviso.innerHTML = `
      <div style="font-size:24px" aria-hidden="true">${bandera}</div>
      <div>
        <h3>Resultado de la conversión</h3>
        <p>${pesosFormato} pesos argentinos equivalen aproximadamente a:</p>
        <div style="font-size:25px;font-weight:850;color:#17452F;margin:8px 0">
          ${destino.simbolo} ${formato}
        </div>
        <p>Moneda seleccionada: ${destino.nombre}.</p>
        <p style="font-size:11px">
          Cálculo de demostración con cotizaciones ilustrativas.
          No es una cotización en vivo.
        </p>
      </div>
    `;

    aviso.classList.remove("oculto");
  }

  document.getElementById("calcular").addEventListener("click", calcularConversion);

  document.getElementById("importe").addEventListener("keydown", evento => {
    if (evento.key === "Enter") calcularConversion();
  });

  // Datos de ejemplo para las fichas comerciales.
  const datosFichas = {
    juan: {
      nombre: "Textil Juan",
      descripcion: "Venta de telas por kilo y precios mayoristas.",
      fotos: [
        "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=600&q=80",
        "https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?auto=format&fit=crop&w=600&q=80"
      ],
      texto: "Algunas telas disponibles: W15, W18, dry fit y otros tipos de tela. Consultá por colores y stock.",
      telefono: "WhatsApp del comercio",
      ubicacion: "Ubicación de ejemplo en Villa Celina"
    },
    chisla: {
      nombre: "Bordados Chisla",
      descripcion: "Bordados personalizados.",
      fotos: [
        "https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=600&q=80",
        "https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80"
      ],
      texto: "Bordados de nombres, escudos y diseños personalizados. Consultá por trabajos y disponibilidad.",
      telefono: "WhatsApp del comercio",
      ubicacion: "Ubicación de ejemplo en Villa Celina"
    },
    andy: {
      nombre: "Sublimados Andy",
      descripcion: "Sublimación y personalización.",
      fotos: [
        "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80",
        "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=600&q=80"
      ],
      texto: "Estampados y prendas personalizadas. Consultá por diseños, cantidades y disponibilidad.",
      telefono: "WhatsApp del comercio",
      ubicacion: "Ubicación de ejemplo en Villa Celina"
    }
  };

  function abrirFicha(id) {
    const negocio = datosFichas[id];
    if (!negocio) return;

    const fotosHTML = negocio.fotos.map((url, indice) => `
      <div class="foto">
        <img
          src="${url}"
          alt="Imagen ilustrativa ${indice + 1} de ${negocio.nombre}"
          loading="lazy"
          onerror="this.style.display='none';this.parentElement.textContent='Foto próximamente';"
        >
      </div>
    `).join("");

    document.getElementById("contenidoFicha").innerHTML = `
      <div class="nombre-ficha">${negocio.nombre}</div>
      <p class="suave">${negocio.descripcion}</p>

      <div class="fotos">${fotosHTML}</div>

      <p class="texto-ficha">${negocio.texto}</p>

      <hr class="separador">

      <div class="contacto">
        <div class="contacto-icono">☏</div>
        <div>
          <div class="contacto-titulo">Contacto</div>
          <div class="contacto-detalle">${negocio.telefono}</div>
          <div class="nota">El contacto real se agregará cuando el comercio proporcione sus datos.</div>
        </div>
      </div>

      <div class="contacto">
        <div class="contacto-icono">⌖</div>
        <div>
          <div class="contacto-titulo">Ubicación</div>
          <div class="contacto-detalle">${negocio.ubicacion}</div>
          <div class="nota">La dirección y el mapa se incorporarán al verificar el negocio.</div>
        </div>
      </div>
    `;

    mostrarPantalla("ficha");
  }

  document.querySelectorAll("[data-ficha]").forEach(boton => {
    boton.addEventListener("click", () => {
      abrirFicha(boton.dataset.ficha);
    });
  });

  // Categorías: muestra los comercios de ejemplo que coinciden.
  const categorias = {
    "Bordados": ["chisla"],
    "Sublimación": ["andy"],
    "Taller de costura": [],
    "Etiquetas": [],
    "Plotter y vinilo": [],
    "Planchado textil": []
  };

  document.querySelectorAll("[data-servicio]").forEach(boton => {
    boton.addEventListener("click", () => {
      const servicio = boton.dataset.servicio;
      const coincidencias = categorias[servicio] || [];
      const tarjetas = document.querySelectorAll("[data-ficha]");
      const resultado = document.getElementById("resultadoServicio");

      document.querySelectorAll("[data-servicio]").forEach(item => {
        item.classList.toggle("activo", item === boton);
        item.setAttribute("aria-pressed", String(item === boton));
      });

      tarjetas.forEach(tarjeta => {
        tarjeta.classList.toggle(
          "oculto",
          !coincidencias.includes(tarjeta.dataset.ficha)
        );
      });

      if (coincidencias.length) {
        resultado.textContent =
          `Comercios de ejemplo para ${servicio}. Tocá una tarjeta para ver su ficha.`;
      } else {
        resultado.textContent =
          `Todavía no hay comercios de ejemplo publicados para ${servicio}.`;
      }

      resultado.classList.remove("oculto");
    });
  });

  // Aviso informativo de publicidad.
  document.getElementById("mostrarPublicidad").addEventListener("click", () => {
    const detalle = document.getElementById("detallePublicidad");
    detalle.classList.toggle("oculto");

    document.getElementById("mostrarPublicidad").textContent =
      detalle.classList.contains("oculto")
        ? "¡Publicitá tu negocio!"
        : "Ocultar información";
  });
                                                         </script>
